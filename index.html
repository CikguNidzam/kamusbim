<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="[TAJUK]" />
  <meta name="theme-color" content="#000000" />
  <title>[TAJUK]</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    #app-frame {
      position: fixed;
      inset: 0;
      inset: env(safe-area-inset-top, 0)
             env(safe-area-inset-right, 0)
             env(safe-area-inset-bottom, 0)
             env(safe-area-inset-left, 0);
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      outline: none;
      display: block;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Loading screen */
    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-title {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      letter-spacing: 0.05em;
      opacity: 0.6;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2.5px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.8);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading overlay -->
  <div id="loader">
    <div class="spinner"></div>
    <span class="loader-title">[TAJUK]</span>
  </div>

  <!-- GAS iframe -->
  <iframe
    id="app-frame"
    src="[https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbxbQRRcE6dxT0A5XiwY8VgL-EqlA0iSxBSteyGHWZoadaUI2mlP1VG_3i9QBUlam4GrOw/exec]"
    title="[KAMUS VIDEO ISYARAT]"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write"
    allowfullscreen
    loading="eager"
    scrolling="yes"
  ></iframe>

  <script>
    const frame = document.getElementById('app-frame');
    const loader = document.getElementById('loader');

    // Hide loader once iframe loads
    frame.addEventListener('load', () => {
      loader.classList.add('hidden');
    });

    // Fallback: hide loader after 8s regardless
    setTimeout(() => {
      loader.classList.add('hidden');
    }, 8000);

    // Prevent body scroll bounce on iOS
    document.body.addEventListener('touchmove', (e) => {
      if (e.target === document.body || e.target === document.documentElement) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>

</body>
</html>
